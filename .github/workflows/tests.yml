name: Comprehensive Test Suite

on:
  push:
    branches: [main, develop, afik_chages]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # BACKEND TESTS (Fast, no server needed)
  # ─────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Web UI Server Tests
        run: |
          pytest tests/test_web_ui_server.py -v --tb=short --junit-xml=junit-server.xml

      - name: Run Web UI Integration Tests
        run: |
          pytest tests/test_web_ui_integration.py -v --tb=short --junit-xml=junit-integration.xml

      - name: Run Logic Engine Tests
        run: |
          pytest tests/test_logic_comprehensive.py -v --tb=short --junit-xml=junit-logic.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit-*.xml

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: junit-*.xml
          check_name: Backend Tests (${{ matrix.python-version }})

  # ─────────────────────────────────────────────────────────────────
  # CODE QUALITY
  # ─────────────────────────────────────────────────────────────────
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint flake8 black isort

      - name: Check code style with Black
        run: black --check DuckChess_Game/ web_ui/ tests/ || true

      - name: Check import sorting with isort
        run: isort --check-only DuckChess_Game/ web_ui/ tests/ || true

      - name: Lint with Flake8
        run: flake8 DuckChess_Game/ web_ui/ tests/ --max-line-length=100 || true

  # ─────────────────────────────────────────────────────────────────
  # E2E TESTS (Requires server)
  # ─────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Browser Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Start Web Server
        run: |
          python -m uvicorn web_ui.server:app --host 127.0.0.1 --port 7890 &
          sleep 3
          curl http://localhost:7890 || true

      - name: Run E2E Auth & Menu Tests
        run: pytest tests/test_e2e_auth_and_menu.py -v --tb=short --junit-xml=junit-e2e-auth.xml || true

      - name: Run E2E Gameplay Tests
        run: pytest tests/test_e2e_gameplay.py -v --tb=short --junit-xml=junit-e2e-gameplay.xml || true

      - name: Run E2E Save & Replay Tests
        run: pytest tests/test_e2e_save_replay.py -v --tb=short --junit-xml=junit-e2e-replay.xml || true

      - name: Upload E2E Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-results
          path: junit-e2e-*.xml

      - name: Upload Screenshots
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/

  # ─────────────────────────────────────────────────────────────────
  # PERFORMANCE TESTS
  # ─────────────────────────────────────────────────────────────────
  performance-tests:
    name: Performance & Load Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Web Server
        run: |
          python -m uvicorn web_ui.server:app --host 127.0.0.1 --port 7890 &
          sleep 3

      - name: Run Performance Tests
        run: pytest tests/test_performance.py -v --tb=short --json-report --json-report-file=performance.json || true

      - name: Upload Performance Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-report
          path: performance.json

  # ─────────────────────────────────────────────────────────────────
  # VISUAL REGRESSION TESTS
  # ─────────────────────────────────────────────────────────────────
  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright pytest-playwright pillow

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Start Web Server
        run: |
          python -m uvicorn web_ui.server:app --host 127.0.0.1 --port 7890 &
          sleep 3

      - name: Run Visual Regression Tests
        run: pytest tests/test_visual_regression.py -v --tb=short || true

      - name: Upload Visual Diffs
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: visual-diffs
          path: test-results/visual-diffs/

  # ─────────────────────────────────────────────────────────────────
  # COVERAGE REPORT
  # ─────────────────────────────────────────────────────────────────
  coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run tests with coverage
        run: |
          pytest tests/test_web_ui_server.py tests/test_web_ui_integration.py tests/test_logic_comprehensive.py \
            --cov=web_ui \
            --cov=DuckChess_Game.Logic \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v3
        with:
          name: coverage-reports
          path: htmlcov/

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  # ─────────────────────────────────────────────────────────────────
  # SUMMARY & STATUS CHECK
  # ─────────────────────────────────────────────────────────────────
  test-summary:
    name: Test Summary
    needs: [backend-tests, code-quality, e2e-tests, performance-tests, visual-regression, coverage]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check Test Results
        run: |
          echo "=== Test Execution Summary ==="
          echo "✅ Backend Tests: ${{ needs.backend-tests.result }}"
          echo "✅ Code Quality: ${{ needs.code-quality.result }}"
          echo "✅ E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "✅ Performance: ${{ needs.performance-tests.result }}"
          echo "✅ Visual Regression: ${{ needs.visual-regression.result }}"
          echo "✅ Coverage: ${{ needs.coverage.result }}"

      - name: Download Artifacts
        uses: actions/download-artifact@v3
        if: always()

      - name: Generate Test Report
        run: |
          echo "# Test Report" > test_report.md
          echo "Generated: $(date)" >> test_report.md
          echo "" >> test_report.md
          echo "## Summary" >> test_report.md
          echo "- Backend Tests: ${{ needs.backend-tests.result }}" >> test_report.md
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> test_report.md
          echo "- E2E Tests: ${{ needs.e2e-tests.result }}" >> test_report.md
          echo "- Performance: ${{ needs.performance-tests.result }}" >> test_report.md
          echo "- Visual Regression: ${{ needs.visual-regression.result }}" >> test_report.md
          echo "- Coverage: ${{ needs.coverage.result }}" >> test_report.md

      - name: Upload Test Report
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: test_report.md

      - name: Fail if critical tests failed
        if: needs.backend-tests.result == 'failure' || needs.code-quality.result == 'failure'
        run: exit 1
